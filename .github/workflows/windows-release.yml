name: Build and publish MPOL Messenger (Windows x64)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "tests/**"
      - "assets/**"
      - "MpolMessenger.ico"
      - ".github/workflows/windows-release.yml"
      - "START_LOCAL.bat"
      - "compose.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache: false

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check client/ui/app.js
          node --check client/ui/voice.js
          node --check client/ui/calls.js

      - name: Set up Python for server tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test real-time friend requests
        shell: pwsh
        run: |
          python -m pip install -r server/requirements.txt httpx
          python tests/test_friend_realtime.py
          python tests/test_mpol2.py

      - name: Build Windows executable
        shell: pwsh
        run: |
          Push-Location client
          go build -trimpath -ldflags "-H windowsgui -s -w" -o ../MpolMessenger.exe .
          if ($LASTEXITCODE -ne 0) { throw "Go build failed" }
          Pop-Location
          if (!(Test-Path MpolMessenger.exe)) { throw "MpolMessenger.exe missing" }

      - name: Package complete client/server project
        shell: pwsh
        run: |
          $files = @("MpolMessenger.exe", "MpolMessenger.ico", "README.md", "Caddyfile", "START_LOCAL.bat", ".env.example", "compose.yaml", "server", "client", "assets", "tests") | Where-Object { Test-Path $_ }
          Compress-Archive -Path $files -DestinationPath MpolMessenger_Full_Project.zip -Force
          if (!(Test-Path MpolMessenger_Full_Project.zip)) { throw "ZIP missing" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MPOL-Messenger-Windows-x64
          path: |
            MpolMessenger.exe
            MpolMessenger_Full_Project.zip
          if-no-files-found: error

      - name: Publish beta release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v2.1.0"
          $assets = @("MpolMessenger.exe", "MpolMessenger_Full_Project.zip")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets --title "MPOL Messenger 2.1.0 — Profile, Calls, Deleted Messages and Update Manager" --notes "MPOL 2.1 release: exact server-side developer role allowlist, improved profile, chat avatars, physical deletion of new messages, microphone recovery, noise/echo cancellation, ringtone and Windows updater with hash verification. Existing older EXE cannot silently self-update; download from GitHub Releases. WebRTC STUN-only, TURN not configured. Not E2EE or security audited." --prerelease --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed" }
