name: Build MPOL Desktop Electron EXE (Windows x64)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "client/ui/**"
      - "server/**"
      - "tests/**"
      - ".github/workflows/electron-desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned Electron and electron-builder
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }

      - name: Validate main process and security tests
        working-directory: desktop
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw "Electron code syntax check failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Electron security tests failed" }
          node --check ../client/ui/calls.js
          if ($LASTEXITCODE -ne 0) { throw "Call frontend syntax validation failed" }
          Push-Location ..
          foreach ($script in @("client/ui/assistant-core.js","client/ui/assistant.js")) {
            node --check $script
            if ($LASTEXITCODE -ne 0) { throw "Assistant JavaScript syntax failed: $script" }
          }
          foreach ($test in @("tests/test_call_audio.cjs","tests/test_video_calls.cjs","tests/test_sounds.cjs","tests/test_assistant.cjs")) {
            node $test
            if ($LASTEXITCODE -ne 0) { throw "MPOL regression failed: $test" }
          }
          Pop-Location

      - name: Set up Python for private offline Russian speech
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and diagnose bundled Vosk Russian voice engine
        run: |
          python -m pip install --disable-pip-version-check vosk==0.3.45 sounddevice==0.5.2 pyinstaller==6.14.2
          if ($LASTEXITCODE -ne 0) { throw "Voice engine Python dependencies failed" }
          $zip = Join-Path $env:RUNNER_TEMP "vosk-model-small-ru-0.22.zip"
          $url = "https://huggingface.co/rhasspy/vosk-models/resolve/e7ac2109d134b5f2404ba95389b2fb51916d4cab/ru/vosk-model-small-ru-0.22.zip"
          curl.exe -fLsS --retry 4 --retry-delay 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "Offline Russian model download failed" }
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne "961d5ff98a17f4aa6de69864d0aa71fa5bac682301d2b5d17a3f24c5c99a46d4") {
            throw "Offline model checksum mismatch"
          }
          New-Item -ItemType Directory -Path desktop/speech-bundle -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath desktop/speech-bundle -Force
          $model = (Resolve-Path "desktop/speech-bundle/vosk-model-small-ru-0.22").Path
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/mpol-pyinstaller" -Force | Out-Null
          python -m py_compile desktop/native/mpol_speech.py
          python tests/test_offline_speech.py
          if ($LASTEXITCODE -ne 0) { throw "Offline speech protocol tests failed" }
          if ($LASTEXITCODE -ne 0) { throw "Offline speech worker syntax invalid" }
          python -m PyInstaller --noconfirm --clean --onedir --console --name mpol-speech --collect-all vosk --collect-all sounddevice --distpath desktop/speech-bundle --workpath "$env:RUNNER_TEMP/mpol-pyinstaller" --specpath "$env:RUNNER_TEMP/mpol-pyinstaller" desktop/native/mpol_speech.py
          if ($LASTEXITCODE -ne 0) { throw "Offline Russian voice worker packaging failed" }
          $worker = (Resolve-Path "desktop/speech-bundle/mpol-speech/mpol-speech.exe").Path
          $output = & $worker --model $model --diagnose
          if ($LASTEXITCODE -ne 0) { throw "Voice engine diagnostic failed" }
          $status = ($output | Select-Object -Last 1 | ConvertFrom-Json)
          if ($status.ok -ne $true -or $status.engine -ne "vosk-ru-offline") {
            throw "Offline voice engine did not load model: $output"
          }
          Write-Host "Offline Russian voice engine and model loaded successfully"

      - name: Verify shared MPOL icons and application icon
        run: |
          $icons = @("messages.webp", "friends.webp", "requests.webp", "search.webp")
          foreach ($icon in $icons) {
            $path = Join-Path "client/ui/icons" $icon
            if (!(Test-Path $path)) { throw "Missing original MPOL nav icon: $path" }
            if ((Get-Item $path).Length -lt 100) { throw "MPOL nav icon is empty: $path" }
          }
          if (!(Test-Path "MpolMessenger.ico")) { throw "Missing application ICO" }

      - name: Compile portable EXE and permanent Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }
          foreach ($filename in @("MpolMessengerSetup.exe","MpolMessenger.exe")) {
            $file = Join-Path "dist" $filename
            if (!(Test-Path $file)) { throw "Missing Windows release asset: $file" }
            $binary = (Get-Item $file)
            if ($binary.Length -lt 40000000) { throw "Windows binary is too small: $($binary.Length)" }
            $stream = [System.IO.File]::OpenRead($binary.FullName)
            try {
              if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Invalid EXE PE header for $filename" }
            } finally { $stream.Dispose() }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            Write-Host "Verified $filename : $($binary.Length) bytes, SHA256 $hash"
          }

      - name: Verify real installer creates a permanent application and Start shortcut
        working-directory: desktop
        run: |
          $exe = (Resolve-Path "dist/MpolMessengerSetup.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "NSIS installer exit code $($proc.ExitCode)" }
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs"
          $installed = Get-ChildItem -Path $installRoot -Recurse -Filter "Mpol Messenger.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$installed) { throw "No permanent installed MPOL application at $installRoot" }
          $start = [Environment]::GetFolderPath("Programs")
          $shortcuts = Get-ChildItem -Path $start -Recurse -Filter "*.lnk" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*Mpol*" }
          $shell = New-Object -ComObject WScript.Shell
          $good = $false
          foreach ($link in $shortcuts) {
            $target = $shell.CreateShortcut($link.FullName).TargetPath
            if ($target -eq $installed.FullName) { $good = $true; break }
          }
          if (!$good) { throw "Start Menu MPOL shortcut missing or points to temporary NSIS extraction" }
          $speechDir = Join-Path (Split-Path $installed.FullName -Parent) "resources/speech"
          $workerExe = Join-Path $speechDir "mpol-speech/mpol-speech.exe"
          $modelDir = Join-Path $speechDir "vosk-model-small-ru-0.22"
          if (!(Test-Path $workerExe) -or !(Test-Path $modelDir)) {
            throw "Installer did not copy offline Russian speech engine and model"
          }
          $diagnostic = & $workerExe --model $modelDir --diagnose | Select-Object -Last 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $diagnostic.ok -ne $true) {
            throw "Installed offline Russian speech engine failed self-diagnostic"
          }
          Write-Host "Permanent installation verified: $($installed.FullName)"


      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPOL-Messenger-Electron-3.7.2-x64
          path: |
            desktop/dist/MpolMessengerSetup.exe
            desktop/dist/MpolMessenger.exe
          if-no-files-found: error

      - name: Publish verified Electron desktop release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v3.7.2-desktop"
          $assets = @("desktop/dist/MpolMessengerSetup.exe","desktop/dist/MpolMessenger.exe")
          $title = "MPOL Messenger Desktop 3.7.2 — Smarter Russian Voice Commands"
          $notes = "MPOL 3.7.2 Windows x64: expanded on-device Russian command understanding for chats, calls, groups, profiles, friends, multiple speech formulations and phonetic usernames; chooses recognized alternatives from HTML speech and offline Windows Vosk, preserves speech across short pauses, and displays locally heard text when it cannot understand. No paid API key and no remote speech upload by the offline Windows engine; browser speech availability still depends on browser/provider. Existing messages and accounts unchanged."
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets --title $title --notes $notes --prerelease --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Electron EXE release failed" }
