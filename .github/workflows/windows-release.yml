name: Build and publish MPOL Messenger (Windows x64)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "tests/**"
      - "assets/**"
      - "MpolMessenger.ico"
      - ".github/workflows/windows-release.yml"
      - "START_LOCAL.bat"
      - "compose.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache: false

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check client/ui/app.js
          node --check client/ui/voice.js
          node --check client/ui/calls.js
          node tests/test_client_account_ownership.cjs
          node tests/test_call_audio.cjs
          node tests/test_video_calls.cjs
          node --check client/ui/sounds.js
          node tests/test_sounds.cjs
          node --check client/ui/assistant-core.js
          if ($LASTEXITCODE -ne 0) { throw "Assistant core failed syntax validation" }
          node --check client/ui/assistant.js
          if ($LASTEXITCODE -ne 0) { throw "Assistant UI failed syntax validation" }
          node tests/test_assistant.cjs
          if ($LASTEXITCODE -ne 0) { throw "Voice assistant regression test failed" }
          node --check client/ui/servers.js
          if ($LASTEXITCODE -ne 0) { throw "Server interface syntax failed" }
          node tests/test_servers_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw "Server interface regression failed" }

      - name: Browser layout smoke test (Microsoft Edge / Chrome)
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock playwright-core
          node tests/test_layout.cjs
          if ($LASTEXITCODE -ne 0) { throw "Browser layout smoke test failed" }
          node tests/test_servers_browser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Servers browser integration failed" }
          node tests/test_auth_persistence.cjs

      - name: Set up Python for server tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test real-time friend requests
        shell: pwsh
        run: |
          python -m pip install -r server/requirements.txt httpx
          python tests/test_friend_realtime.py
          python tests/test_mpol2.py
          python -m py_compile server/server_spaces.py
          if ($LASTEXITCODE -ne 0) { throw "Server API syntax failed" }
          python tests/test_servers.py
          if ($LASTEXITCODE -ne 0) { throw "Server API regression failed" }

      - name: Build Windows executable
        shell: pwsh
        run: |
          Push-Location client
          go build -trimpath -ldflags "-H windowsgui -s -w" -o ../MpolMessenger.exe .
          if ($LASTEXITCODE -ne 0) { throw "Go build failed" }
          Pop-Location
          if (!(Test-Path MpolMessenger.exe)) { throw "MpolMessenger.exe missing" }

      - name: Package complete client/server project
        shell: pwsh
        run: |
          $files = @("MpolMessenger.exe", "MpolMessenger.ico", "README.md", "Caddyfile", "START_LOCAL.bat", ".env.example", "compose.yaml", "server", "client", "assets", "tests") | Where-Object { Test-Path $_ }
          Compress-Archive -Path $files -DestinationPath MpolMessenger_Full_Project.zip -Force
          if (!(Test-Path MpolMessenger_Full_Project.zip)) { throw "ZIP missing" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MPOL-Messenger-Windows-x64
          path: |
            MpolMessenger.exe
            MpolMessenger_Full_Project.zip
          if-no-files-found: error

      - name: Publish legacy Go beta release (manual only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v2.2.1"
          $assets = @("MpolMessenger.exe", "MpolMessenger_Full_Project.zip")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets --title "MPOL Messenger 2.2.1 — Four New MPOL Black Navigation Icons" --notes "MPOL Messenger 2.2.1 includes four new glossy black navigation icons supplied by the designer: Messages, Friends, Friend Requests and Search. Icons optimized in transparent WebP, responsive dark UI, and working online people search; existing Neon accounts/chats preserved." --prerelease --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed" }
